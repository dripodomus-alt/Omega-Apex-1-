[package]
name = "omega_rust_engine"
version = "0.1.0"
edition = "2021"
description = "High-performance arbitrage discovery and ranking engine for Omega V5."

[dependencies]
clap = { version = "4.4", features = ["derive"] }
itertools = "0.12"
md5 = "0.7"
rust_decimal = { version = "1.34", features = ["maths", "serde-float"] }
rust_decimal_macros = "1.34"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"