# Standardized Cloud Build configuration for the Omega V5 service.
# This file uses best practices for repository-triggered builds, automatically
# tagging images with the commit SHA and deploying to Cloud Run.

substitutions:
  _AR_HOSTNAME: us-east1-docker.pkg.dev
  _AR_REPOSITORY: apex-omega
  _IMAGE_NAME: omega-finally-rich
  _SERVICE_NAME: omega-finally-rich
  _DEPLOY_REGION: 'us-east1'
  _SERVICE_ACCOUNT: '323456506288-compute@developer.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: 'Build image'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '.'
      - '-f'
      - 'Dockerfile'

  - id: 'Push image to Artifact Registry'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'

  - id: 'Deploy to Cloud Run'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'
      - '--region=${_DEPLOY_REGION}'
      - '--platform=managed'
      - '--port=8080'
      - '--service-account=$_SERVICE_ACCOUNT'
      - '--no-allow-unauthenticated'
      - '--quiet'

images:
  - '${_AR_HOSTNAME}/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE_NAME}:$SHORT_SHA'

timeout: 1800s
