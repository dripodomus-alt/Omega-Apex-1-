[pytest]
pythonpath = python .
minversion = 7.0
addopts = 
    -q
    --tb=short
    --strict-markers
    --timeout=30
    -m "not slow and not requires_anvil"
    --maxfail=5
    --disable-warnings
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    slow: marks tests as slow (run with -m slow)
    requires_anvil: tests that require a running Anvil or fork RPC (auto-skipped if no FORK_SIM_RPC_URL)
    requires_redis: tests that require Redis connection (auto-skipped if no REDIS)
    live_integration: tests that use live RPC / real pool data (use -m live_integration; requires OMEGA_LIVE_TEST=1 or LIVE_TEST_RPC_URL)
timeout = 30
timeout_method = thread
log_cli = false
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
