# ==============================================================================
# Docker Compose for OMEGA-FINALLY-RICH
#
# This file defines the services based on the new TypeScript monorepo.
#
# Usage:
#   docker compose up -d --build
# ==============================================================================

version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter api start
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter worker start
    env_file:
      - .env
    depends_on:
      - redis
      - api
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter web start
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: omega-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: {}