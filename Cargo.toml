[workspace]
resolver = "2"
members = [
    "crates/apex-types",
    "crates/apex-core",
    "crates/apex-adapters",
    "crates/apex-routing",
    "crates/apex-simulation",
    "python/scanner_core",
]

[workspace.dependencies]
pyo3 = { version = "0.21.0", features = ["extension-module"] }
pyo3-asyncio = { version = "0.21.0", features = ["tokio-runtime"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
alloy-primitives = { version = "0.7.0", features = ["serde", "std"] }
rust_decimal = { version = "1.34.3", features = ["maths", "serde-float", "std"] }
async-trait = "0.1.79"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
petgraph = "0.6.4"
futures = "0.3"