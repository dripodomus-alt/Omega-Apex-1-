[package]
name = "scanner_core"
version = "0.1.0"
edition = "2021"
description = "High-performance price-driven scanner core for Omega V5 arbitrage (PyO3 extension)"

[lib]
name = "scanner_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rust_decimal = { version = "1.34", features = ["maths", "serde-float", "std"] }
rust_decimal_macros = "1.34"
alloy-primitives = { version = "0.7", features = ["serde"] }
thiserror = "1.0"

[build-dependencies]
pyo3-build-config = "0.21"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
